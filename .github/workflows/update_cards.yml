name: Update Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"        # every day, 03:00 UTC (08:00 Tashkent)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_cards.py"
      - "assets/ornaments/**"

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        run: python scripts/generate_cards.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore(cards): update archives cards [skip ci]"
          git pull --rebase origin main
          git push
