<svg width="800" height="50" viewBox="0 0 800 50" xmlns="http://www.w3.org/2000/svg" role="img"><title>Profile Footer</title><style>@keyframes snowfall { 0% { transform: translateY(-10px); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.6; } 100% { transform: translateY(185px); opacity: 0; } }@keyframes drift { 0% { transform: translateX(0); } 50% { transform: translateX(8px); } 100% { transform: translateX(0); } }@keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.7; } }@media (prefers-reduced-motion: reduce) { .snowflake, .twinkle-dot { animation: none !important; } }</style><defs><linearGradient id="fadeEdge" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1E3028" stop-opacity="0"/><stop offset="15%" stop-color="#1E3028" stop-opacity="0.6"/><stop offset="50%" stop-color="#1E3028" stop-opacity="1"/><stop offset="85%" stop-color="#1E3028" stop-opacity="0.6"/><stop offset="100%" stop-color="#1E3028" stop-opacity="0"/></linearGradient><linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8B2030" stop-opacity="0"/><stop offset="50%" stop-color="#8B2030" stop-opacity="0.3"/><stop offset="100%" stop-color="#8B2030" stop-opacity="0"/></linearGradient></defs><rect width="800" height="50" fill="#0A0F0D"/><line x1="100" y1="15" x2="700" y2="15" stroke="url(#fadeEdge)" stroke-width="0.5"/><image href="data:image/png;base64," x="15" y="5" width="38" height="38" opacity="0.15"/><image href="data:image/png;base64," x="747" y="5" width="38" height="38" opacity="0.15"/><text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#4A6058" letter-spacing="4" font-style="italic">crafted with winter magic ❄</text><circle class="snowflake" cx="674" cy="-5" r="1.4" fill="#FFF8F0" opacity="0.18"><animateTransform attributeName="transform" type="translate" values="0,-5;-12,60" dur="7.5s" begin="5.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.18;0.18;0" dur="7.5s" begin="5.9s" repeatCount="indefinite"/></circle><circle class="snowflake" cx="712" cy="-5" r="2.4" fill="#FFF8F0" opacity="0.16"><animateTransform attributeName="transform" type="translate" values="0,-5;-13,60" dur="9.5s" begin="4.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.16;0.16;0" dur="9.5s" begin="4.4s" repeatCount="indefinite"/></circle><circle class="snowflake" cx="243" cy="-5" r="1.6" fill="#FFF8F0" opacity="0.33"><animateTransform attributeName="transform" type="translate" values="0,-5;7,60" dur="9.4s" begin="4.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.33;0.33;0" dur="9.4s" begin="4.8s" repeatCount="indefinite"/></circle><circle class="snowflake" cx="578" cy="-5" r="1.9" fill="#FFF8F0" opacity="0.37"><animateTransform attributeName="transform" type="translate" values="0,-5;9,60" dur="7.7s" begin="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.37;0.37;0" dur="7.7s" begin="3.6s" repeatCount="indefinite"/></circle><circle class="snowflake" cx="183" cy="-5" r="2.3" fill="#FFF8F0" opacity="0.39"><animateTransform attributeName="transform" type="translate" values="0,-5;-5,60" dur="6.9s" begin="2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.39;0.39;0" dur="6.9s" begin="2.7s" repeatCount="indefinite"/></circle><circle class="snowflake" cx="124" cy="-5" r="1.3" fill="#FFF8F0" opacity="0.30"><animateTransform attributeName="transform" type="translate" values="0,-5;10,60" dur="11.1s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.30;0.30;0" dur="11.1s" begin="0.8s" repeatCount="indefinite"/></circle></svg>